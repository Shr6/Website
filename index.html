<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shrijan Pokharel — CSIT student, programmer and cybersecurity specialist based in Bhaktapur, Nepal. Building secure systems, AI tools, and full-stack web applications." />
    <meta name="theme-color" content="#0B1215" />

    <meta property="og:title" content="Shrijan Pokharel — Programmer & Cybersecurity Specialist" />
    <meta property="og:description" content="CSIT student, programmer and Web3 enthusiast. Junior Cyber Security Specialist at InteliATE." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Only the exact weights actually used (verified against computed
         styles) are requested, and the stylesheet is loaded in a
         non-render-blocking way: the browser paints immediately with the
         fallback font stack, then swaps to the webfont once it arrives
         (font-display=swap), instead of waiting on the request first. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <title>Shrijan Pokharel Programmer &amp; Cybersecurity Specialist</title>

    <script>
      // Second half of the GitHub Pages SPA redirect trick (see
      // public/404.html): if we arrived here via a redirected deep link,
      // restore the real URL before the app mounts, so React starts on
      // the correct page instead of always rendering the home route.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("__redirect");
        if (redirect) {
          window.history.replaceState({}, "", redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
